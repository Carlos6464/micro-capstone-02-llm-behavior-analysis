[project]
name = "micro-capstone-02-llm-behavior-analysis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=1,<3", "pydantic>=2,<3", "pandas>=2.2,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "python-dotenv>=1,<2", "pyyaml>=6,<7"]
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
